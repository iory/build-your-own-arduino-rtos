name: docs

on:
  push:
    branches: [main]
    # code/ の変更でも再ビルドする。章のページが literalinclude で code/ を
    # 直接読み込んでいるため、ここを無視するとコードを直してもサイトの表示が
    # 古いまま残る（code/ は原稿リポジトリから publish-code で自動同期される）。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /build-your-own-arduino-rtos/
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: ./scripts/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

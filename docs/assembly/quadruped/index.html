function loadGlb(url) {
  return new Promise((resolve, reject) => {
    gltfLoader.load(url, gltf => {
      const group = gltf.scene;
      group.traverse(o => {
        if (o.isMesh) {
          o.material.metalness = 0.05;
          o.material.roughness = 0.75;
        }
      });
      group.userData.c0 = new THREE.Box3().setFromObject(group)
          .getCenter(new THREE.Vector3());
      resolve(group);
    }, undefined, reject);
  });
}

async function loadMain() {

    const group = await loadGlb(url);
    mainView.parts[name] = group;
    scene.add(group);
  }));
  const box = new THREE.Box3();
  Object.values(mainView.parts).forEach(g => box.expandByObject(g));
  box.getCenter(mainView.center);
  mainView.size = box.getSize(new THREE.Vector3()).length();
  mainView.explodeDist = mainView.size * 0.3;
  (PLAN.islands || []).forEach(isl => {
    if (!isl.dock) return;
    const dock = PLAN.steps.find(
        s => s.kind === 'dock' && s.island === isl.id);
    let d = (dock && dock.direction) || [0, 0, 1];
    mainView.parkOffset[isl.id] =
        new THREE.Vector3(-d[0], -d[1], -d[2]).normalize()
            .multiplyScalar(mainView.size * 0.5);
  });
  mainView.loaded = true;
}

async function loadRecipe(uid) {
  if (recipeViews[uid]) return recipeViews[uid];
  const recipe = RECIPE_BY_ID[uid];
  const v = {id: uid, label: `${uid} ×${recipe.count}`,
             steps: recipe.steps, parts: {}, parkOffset: {},
             explodeDist: 0.05, center: new THREE.Vector3(),
             size: 1, loaded: false, recipe};
  await Promise.all(Object.entries(RECIPE_GLB[uid]).map(
    async ([name, url]) => {
      const group = await loadGlb(url);
      group.visible = false;
      v.parts[name] = group;
      scene.add(group);
    }));
  const box = new THREE.Box3();
  Object.values(v.parts).forEach(g => {
    g.visible = true;
    box.expandByObject(g);
    g.visible = false;
  });
  box.getCenter(v.center);
  v.size = box.getSize(new THREE.Vector3()).length();
  v.explodeDist = v.size * 0.35;
  v.loaded = true;
  recipeViews[uid] = v;
  if (lineMode) Object.values(v.parts).forEach(applyLineMode);
  return v;
}

function fitCamera(v) {
  camera.position.copy(v.center).add(
      new THREE.Vector3(1, -1, 0.6).normalize()
          .multiplyScalar(v.size * 1.4));

}

function hideAllParts() {
  Object.values(mainView.parts).forEach(g => g.visible = false);
  Object.values(recipeViews).forEach(v =>
      Object.values(v.parts).forEach(g => g.visible = false));
}

// ---------- cables ----------
function ensureCable(view, s) {
  view.cables = view.cables || {};
  if (view.cables[s.name]) return view.cables[s.name];
  const group = new THREE.Group();
  const paths = s.wire_paths || [s.points];
  const colors = s.wire_colors || ['#2b2b2b'];
  const radius = paths.length > 1
      ? (s.radius || 0.0015) / (paths.length - 1)
      : (s.radius || 0.0015);
  group.userData.tubes = [];
  paths.forEach((path, i) => {
    const pts = path.map(p => new THREE.Vector3(...p));
    const curve = new THREE.CatmullRomCurve3(pts);
    const geo = new THREE.TubeGeometry(curve, 96, radius, 8);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial(
        {color: new THREE.Color(colors[i] || '#2b2b2b'),
         roughness: 0.85}));
    mesh.userData.indexCount = geo.index.count;
    group.add(mesh);
    group.userData.tubes.push(mesh);
  });
  scene.add(group);
  view.cables[s.name] = group;
  return group;
}

// ---------- step state & animation ----------
function dockIndexOf(island) {
  return view.steps.findIndex(
      s => s.kind === 'dock' && s.island === island);
}

function parkOf(island, k) {
  const di = dockIndexOf(island);
  if (di >= 0 && k <= di) return view.parkOffset[island] || V0;
  return V0;
}

function entryOffset(step) {
  let d = step.direction;
  if (!d || step.base) d = [0, 0, 1];
  return new THREE.Vector3(-d[0], -d[1], -d[2]).normalize()
      .multiplyScalar(view.explodeDist);
}

// Pose a world-baked group as "rotated by angle about a world axis
// through point, then offset" — used for bayonet-style insertions.
function poseAboutAxis(group, point, axisDir, angle, offset) {
  const q = new THREE.Quaternion().setFromAxisAngle(axisDir, angle);
  group.quaternion.copy(q);
  group.position.copy(
      point.clone().sub(point.clone().applyQuaternion(q)))
      .add(offset);
}

      }
    } else if (s.kind === 'dock') {
      anim = {kind: 'dock',

                offsets: ata.offsets,
                start: performance.now(), dur: 1600};
      } else if (motion && motion.type === 'slide_rotate') {
        anim = {kind: 'slide_rotate', name: s.component,
                from: basePos.clone().add(entryOffset(s)),
                to: basePos,
                axisPoint: new THREE.Vector3(...motion.axis_point),
                axisDir: new THREE.Vector3(...motion.axis_dir)
                    .normalize(),
                angle: THREE.MathUtils.degToRad(motion.angle_deg),
                start: performance.now(), dur: 1400};
      } else {
        anim = {kind: 'part', name: s.component,
                from: basePos.clone().add(entryOffset(s)),
                to: basePos,
                start: performance.now(), dur: 700};
      }
    }
  }
  current = k;
  updateUi();
  updateArrow();
}

// ---------- insertion arrow for the active step ----------
let stepArrow = null;
const arrowMaterial = new THREE.MeshBasicMaterial(
    {color: 0xeb8223, depthTest: false, transparent: true,
     opacity: 0.95});

function makeArrow(origin, dir, length) {
  // Fat always-on-top arrow (cylinder + cone), never hidden by parts.
  const group = new THREE.Group();
  const shaftLen = length * 0.7;
  const headLen = length * 0.3;
  const radius = length * 0.045;
  const shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(radius, radius, shaftLen, 20),
      arrowMaterial);
  shaft.position.y = shaftLen / 2;
  const head = new THREE.Mesh(
      new THREE.ConeGeometry(radius * 2.4, headLen, 20),
      arrowMaterial);
  head.position.y = shaftLen + headLen / 2;
  group.add(shaft);
  group.add(head);
  group.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0), dir);
  group.position.copy(origin);
  group.renderOrder = 999;
  shaft.renderOrder = 999;
  head.renderOrder = 999;
  return group;
}

function updateArrow() {
  if (stepArrow) { scene.remove(stepArrow); stepArrow = null; }
  if (current === 0) return;
  const s = view.steps[current - 1];
  if (!s || s.base) return;
  let origin, dir, len;
  if (s.kind === 'dock') {
    const park = view.parkOffset[s.island];
    if (!park || park.lengthSq() === 0) return;
    const centers = s.members.map(m => view.parts[m])
        .filter(Boolean).map(p => p.userData.c0.clone());
    if (!centers.length) return;
    const center = centers.reduce((a, b) => a.add(b),
        new THREE.Vector3()).multiplyScalar(1 / centers.length);
    origin = center.add(park.clone().multiplyScalar(0.78));
    dir = park.clone().multiplyScalar(-1).normalize();
    len = park.length() * 0.6;
  } else {
    const part = view.parts[s.component];
    if (!part || !s.direction) return;
    const offset = entryOffset(s);
    origin = part.userData.c0.clone()
        .add(parkOf(s.island, current))
        .add(offset.clone().multiplyScalar(0.80));
    dir = offset.clone().multiplyScalar(-1).normalize();
    len = offset.length() * 0.62;
  }
  stepArrow = makeArrow(origin, dir, len);
  scene.add(stepArrow);
}

// ---------- line-art mode ----------
let lineMode = false;
const edgeMaterial = new THREE.LineBasicMaterial({color: 0x222222});
const paperMaterial = new THREE.MeshBasicMaterial({
  color: 0xffffff, polygonOffset: true,
  polygonOffsetFactor: 1, polygonOffsetUnits: 1});
// Inverted-hull silhouette: filleted or curved surfaces have no
// crease edges, so EdgesGeometry alone loses e.g. the servo outline.
const outlineMaterial = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: {thickness: {value: 0.0006}},
  vertexShader: `uniform float thickness;
void main() {
  vec3 p = position + normal * thickness;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}`,
  fragmentShader:
      `void main() { gl_FragColor = vec4(0.15, 0.15, 0.15, 1.0); }`,
});

function applyLineMode(group) {
  const meshes = [];
  group.traverse(o => { if (o.isMesh) meshes.push(o); });
  meshes.forEach(o => {
    if (!o.userData.origMaterial) o.userData.origMaterial = o.material;
    if (lineMode) {
      if (!o.userData.edges) {
        o.userData.edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(o.geometry, 15), edgeMaterial);
        o.add(o.userData.edges);
      }
      if (!o.userData.outline) {
        o.userData.outline = new THREE.Mesh(o.geometry,
                                            outlineMaterial);
        o.add(o.userData.outline);
      }
      o.userData.edges.visible = true;
      o.userData.outline.visible = true;
      o.material = paperMaterial;
    } else {
      if (o.userData.edges) o.userData.edges.visible = false;
      if (o.userData.outline) o.userData.outline.visible = false;
      o.material = o.userData.origMaterial;
    }
  });
}

function setLineMode(on) {
  lineMode = on;
  Object.values(mainView.parts).forEach(applyLineMode);
  Object.values(recipeViews).forEach(v =>
      Object.values(v.parts).forEach(applyLineMode));
  document.getElementById('lineBtn').textContent =
      on ? '通常表示' : '線画';
}
document.getElementById('lineBtn').onclick =
    () => setLineMode(!lineMode);
document.getElementById('ataCheck').onchange =

// ---------- reorder re-validation & save ----------
const ORIGINAL_STEPS = PLAN.steps.slice();

function dirtyRange() {
  let lo = -1, hi = -1;
  mainView.steps.forEach((s, i) => {
    if (s !== ORIGINAL_STEPS[i]) {
      if (lo < 0) lo = i;
      hi = i;
    }
  });
  return [lo, hi];
}

function updateSaveButton() {
  const [lo] = dirtyRange();
  document.getElementById('saveBtn').disabled = lo < 0;
}

document.getElementById('saveBtn').onclick = async () => {
  const [lo, hi] = dirtyRange();
  if (lo < 0) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  const summary = document.getElementById('summary');
  summary.textContent =
      `保存中… サーバで再検証と差分再描画 (Step ${lo + 1}–${hi + 1})`;
  const order = mainView.steps.map(s =>
      s.kind === 'dock' ? {kind: 'dock', island: s.island}
      : (s.kind === 'fasten' || s.kind === 'wire')
          ? {kind: s.kind}
          : {component: s.component});
  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({order, lo, hi}),
    });
    if (!res.ok) throw new Error(await res.text());
    summary.textContent = '保存完了 — 再読み込みします…';
    setTimeout(() => location.reload(), 800);
  } catch (e) {
    summary.textContent = `保存失敗: ${e.message}`;

  }
};

let revalidateToken = 0;

function applyValidation(results) {
  results.forEach(r => {
    const s = mainView.steps[r.index];
    s.verified = r.verified;
    if (r.direction) s.direction = r.direction;
    if (r.clearance_mm != null) s.clearance_mm = r.clearance_mm;
    if (r.screw_blocked != null) s.screw_blocked = r.screw_blocked;
    s.revalidate_reason = r.reason || null;
  });
}

async function postValidate(order, lo, hi, quick) {
  const res = await fetch('/api/validate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({order, lo, hi, quick}),
  });
  if (!res.ok) throw new Error(await res.text());
  return (await res.json()).results;
}

async function revalidate(lo, hi) {
  const token = ++revalidateToken;
  const summary = document.getElementById('summary');
  const order = mainView.steps.map(s =>
      s.kind === 'dock' ? {kind: 'dock', island: s.island}
      : (s.kind === 'fasten' || s.kind === 'wire')
          ? {kind: s.kind}
          : {component: s.component});
  try {
    // Tier 1: coarse check, near-instant feedback.
    summary.textContent =
        `粗チェック中… (Step ${lo + 1}–${hi + 1})`;
    const quick = await postValidate(order, lo, hi, true);
    if (token !== revalidateToken) return;
    applyValidation(quick);
    buildSidebar();
    // Tier 2: precise sweep with clearance scoring.
    summary.textContent =
        `粗チェック済み — 精密再計算中… (Step ${lo + 1}–${hi + 1})`;
    const full = await postValidate(order, lo, hi, false);
    if (token !== revalidateToken) return;
    applyValidation(full);
  } catch (e) {
    if (token !== revalidateToken) return;
    for (let i = lo; i <= hi; i++) {
      const s = mainView.steps[i];
      if (s.kind !== 'dock' && !s.base) {
        s.verified = false;
        s.revalidate_reason = '再計算サーバに接続できず（未検証）';
      }
    }
  }
  buildSidebar();
}

function tick(now) {
  requestAnimationFrame(tick);
  if (anim) {
    const t = Math.min(1, (now - anim.start) / anim.dur);
    const ease = 1 - Math.pow(1 - t, 3);
    if (anim.kind === 'part') {
      const part = view.parts[anim.name];
      if (part) part.position.lerpVectors(anim.from, anim.to, ease);
    } else if (anim.kind === 'wire') {
      anim.cable.userData.tubes.forEach(tube => {
        const count = Math.max(3, Math.floor(
            tube.userData.indexCount * ease / 3) * 3);
        tube.geometry.setDrawRange(
            0, t >= 1 ? tube.userData.indexCount : count);
      });
    } else if (anim.kind === 'fasten') {
      anim.screws.forEach(sc => {
        const part = view.parts[sc.name];
        if (part) {
          part.position.copy(sc.base.clone()
              .add(sc.from.clone().multiplyScalar(1 - ease)));
        }
      });
    } else if (anim.kind === 'ata') {
      // Follow the reversed disassembly polyline: far end -> 0.
      const part = view.parts[anim.name];
      if (part) {
        const pts = anim.offsets;
        const u = (1 - ease) * (pts.length - 1);
        const i0 = Math.min(Math.floor(u), pts.length - 2);
        const frac = u - i0;
        const a = pts[i0], b = pts[i0 + 1];
        part.position.set(
            anim.base.x + a[0] + (b[0] - a[0]) * frac,
            anim.base.y + a[1] + (b[1] - a[1]) * frac,
            anim.base.z + a[2] + (b[2] - a[2]) * frac);
      }
    } else if (anim.kind === 'slide_rotate') {
      // Phase 1 (0..0.55): slide in while held at the pre-rotation
      // orientation; phase 2 (0.55..1): rotate into the mate.
      const part = view.parts[anim.name];
      if (part) {
        const split = 0.55;
        const startAngle = -anim.angle;
        if (t < split) {
          const p = 1 - Math.pow(1 - t / split, 3);
          const slide = anim.from.clone().sub(anim.to)
              .multiplyScalar(1 - p).add(anim.to);
          poseAboutAxis(part, anim.axisPoint, anim.axisDir,
                        startAngle, slide);
        } else {
          const p = 1 - Math.pow(1 - (t - split) / (1 - split), 3);
          poseAboutAxis(part, anim.axisPoint, anim.axisDir,
                        startAngle * (1 - p), anim.to.clone());
        }
      }
    } else {
      anim.members.forEach(m =>
          view.parts[m].position.lerpVectors(anim.from, V0, ease));
    }
    if (t >= 1) {
      if (anim.kind === 'slide_rotate') {
        const part = view.parts[anim.name];
        if (part) {
          part.quaternion.identity();
          part.position.copy(anim.to);
        }
      }
      anim = null;
    }
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

function updateDepthGuide(point) {
  // Vertical guide down to the scene floor: the classic depth cue.
  if (depthGuide) { scene.remove(depthGuide); depthGuide = null; }
  if (!point) return;
  const floorZ = sceneFloorZ();
  const geo = new THREE.BufferGeometry().setFromPoints([
      point, new THREE.Vector3(point.x, point.y, floorZ)]);
  depthGuide = new THREE.Line(geo, new THREE.LineDashedMaterial(
      {color: 0x888888, dashSize: 0.004, gapSize: 0.003,
       depthTest: false, transparent: true, opacity: 0.9}));
  depthGuide.computeLineDistances();
  depthGuide.renderOrder = 996;
  scene.add(depthGuide);
}

let cachedFloorZ = null;
function sceneFloorZ() {
  if (cachedFloorZ === null) {
    const box = new THREE.Box3();
    Object.values(mainView.parts).forEach(g => {
      if (g.visible) box.expandByObject(g);
    });
    cachedFloorZ = box.min.z;
  }
  return cachedFloorZ;
}

function wireOffsetPaths(pts) {
  // Parallel-transported ribbon offsets, mirroring the Python side.
  const colors = WIRE_STYLE.wires || ['#2b2b2b'];
  const spacing = WIRE_STYLE.wire_spacing || 0.0013;
  if (colors.length < 2) return [{pts, color: colors[0]}];
  const tangents = pts.map((p, i) => {
    const a = pts[Math.max(i - 1, 0)];
    const b = pts[Math.min(i + 1, pts.length - 1)];
    const t = b.clone().sub(a);
    return t.lengthSq() > 1e-18 ? t.normalize()
                                : new THREE.Vector3(1, 0, 0);
  });
  let normal = new THREE.Vector3().crossVectors(
      tangents[0], new THREE.Vector3(0, 0, 1));
  if (normal.lengthSq() < 1e-12) {
    normal = new THREE.Vector3().crossVectors(
        tangents[0], new THREE.Vector3(0, 1, 0));
  }
  normal.normalize();
  const normals = tangents.map(t => {
    normal = normal.clone().sub(
        t.clone().multiplyScalar(normal.dot(t)));
    if (normal.lengthSq() > 1e-12) normal.normalize();
    return normal.clone();
  });
  return colors.map((color, wi) => {
    const offset = (wi - (colors.length - 1) / 2) * spacing;
    return {color,
            pts: pts.map((p, i) => p.clone().add(
                normals[i].clone().multiplyScalar(offset)))};
  });
}

function updatePreview() {
  if (previewTube) { scene.remove(previewTube); previewTube = null; }

  if (routing) {
    pts = [new THREE.Vector3(...routing.from.position),
           ...routing.waypoints];

  } else if (selected) {
    pts = controlPoints();
  }
  if (!pts || pts.length < 2) return;
  const group = new THREE.Group();
  const radius = WIRE_STYLE.wire_radius || 0.0007;
  wireOffsetPaths(pts).forEach(wire => {
    const curve = new THREE.CatmullRomCurve3(wire.pts);
    const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 64, radius, 8),
        new THREE.MeshBasicMaterial(
            {color: new THREE.Color(wire.color), depthTest: false,
             transparent: true, opacity: 0.95}));
    mesh.renderOrder = 997;
    group.add(mesh);
  });
  previewTube = group;
  scene.add(previewTube);

        && wireStep.collides.length
        ? `<div class="cep" style="color:#b22">⚠️ ` +
          `${wireStep.collides.join('、')} と干渉</div>` : '';
    row.innerHTML =
        `<div class="cname" title="${def.name}">${def.name}` +
        (dirty ? ' <span style="color:#b60">*</span>' : '') +
        `<div class="cep">${endpointLabel(def.from)} → ` +
        `${endpointLabel(def.to)}</div>${collides}</div>`;
    const editBtn = document.createElement('button');
    editBtn.textContent = dirty ? '保存' : '編集';
    editBtn.onclick = ev => {
      ev.stopPropagation();
      if (dirty) {
        saveSelected();
      } else {
        clearRouting();
        selectCable(def.name);
        renderCablePanel();
      }
    };
    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'danger';
    deleteBtn.textContent = '削除';
    deleteBtn.onclick = ev => {
      ev.stopPropagation();
      if (window.confirm(
          `ケーブル「${def.name}」を削除しますか?`)) {
        deleteCable(def.name);
      }
    };
    row.onclick = () => {
      clearRouting();
      selectCable(def.name);
      renderCablePanel();
    };
    row.appendChild(editBtn);
    row.appendChild(deleteBtn);
    panel.appendChild(row);
  });
}

function setWireMode(on) {
  wireMode = on;
  showPorts(on);
  showHoles(on);
  clearRouting();
  document.getElementById('wireBtn').textContent =
      on ? '配線モード終了' : '配線モード';
  wireHint(on
      ? '配線モード: ポートか部品上の任意点をクリックで新規配線 / ' +
        'ケーブルをクリックで編集 / 終点はポートクリックか' +
        'ダブルクリックで確定'
      : '');
  renderCablePanel();
  if (on) buildSidebar();
}
document.getElementById('wireBtn').onclick =
    () => setWireMode(!wireMode);

async function postCable(url, payload, busyText) {
  showBusy(busyText || '保存して再計算中…（15秒ほどかかります）');
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById('busyText').textContent =
        '完了 — 再読み込みします…';
    setTimeout(() => location.reload(), 500);
  } catch (e) {
    document.getElementById('busy').style.display = 'none';
    wireHint(`保存失敗: ${e.message}`);
  }
}

function deleteCable(name) {
  // Optimistic: hide it everywhere immediately, then rebuild.
  const index = WIRE_DEFS.findIndex(c => c.name === name);
  if (index >= 0) WIRE_DEFS.splice(index, 1);
  const group = (view.cables || {})[name];
  if (group) group.visible = false;
  if (selected && selected.def.name === name) deselectCable();
  renderCablePanel();
  postCable('/api/cable_update', {name, delete: true},
            `「${name}」を削除して再計算中…`);
}

function saveSelected() {
  if (!selected || !selected.dirty) return;
  postCable('/api/cable_update', {
    name: selected.def.name,
    waypoints: selected.waypoints.map(v => [v.x, v.y, v.z]),
    from: selected.def.from,
    to: selected.def.to,
  });
}

canvas.addEventListener('contextmenu', e => {
  if (wireMode && routing) {
    e.preventDefault();
    if (routing.waypoints.length) {
      routing.waypoints.pop();
      refreshWaypointMarkers();
      updatePreview();
      wireHint('直前の経由点を取り消しました（右クリック=戻す）');
    }
  }
});

window.addEventListener('keydown', e => {
  if (!wireMode) return;
  if (e.key === 'Escape') clearRouting();
  if (e.key === 'Enter') saveSelected();
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected
      && !selected.dirty) {
    if (window.confirm(
        `ケーブル「${selected.def.name}」を削除しますか?`)) {
      deleteCable(selected.def.name);
    }
  }
});

function topPartOf(object) {
  for (const [name, group] of Object.entries(view.parts)) {
    let node = object;
    while (node) {
      if (node === group) return name;
      node = node.parent;
    }
  }
  return null;
}

function finishRouting(toEndpoint) {
  const fromEp = routing.from.port !== undefined
      && routing.from.path !== undefined
      ? {path: routing.from.path, port: routing.from.port}
      : {point: routing.from.point, on: routing.from.on};
  const payload = {
    from: fromEp,
    to: toEndpoint,
    waypoints: routing.waypoints.map(v => [v.x, v.y, v.z]),
  };
  clearRouting();
  postCable('/api/cable', payload);
}

function raycastAt(e) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
}

canvas.addEventListener('pointerdown', e => {
  downPos = [e.clientX, e.clientY];
  if (!wireMode || !selected) return;
  raycastAt(e);
  const hit = raycaster.intersectObjects(handles, false)[0];
  if (hit) {
    draggingHandle = hit.object;
    controls.enabled = false;
    dragPlane.setFromNormalAndCoplanarPoint(
        camera.getWorldDirection(new THREE.Vector3()),
        draggingHandle.position);
    wireHint('ドラッグで移動（Shift+ドラッグ = 上下/奥行き方向）');
  }
});

function dragHandleTo(e) {
  raycastAt(e);
  if (e.shiftKey) {
    // Constrain to the world vertical: depth/height adjustment.
    const origin = draggingHandle.position.clone();
    const axis = new THREE.Vector3(0, 0, 1);
    const camDir = camera.getWorldDirection(new THREE.Vector3());
    const planeNormal = new THREE.Vector3()
        .crossVectors(axis, new THREE.Vector3()
            .crossVectors(camDir, axis)).normalize();
    const plane = new THREE.Plane()
        .setFromNormalAndCoplanarPoint(planeNormal, origin);
    const point = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(plane, point)) {
      const height = point.z;
      draggingHandle.position.z = height;
    }
  } else {
    const point = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(dragPlane, point)) {
      draggingHandle.position.copy(point);
    }
  }
  selected.waypoints[draggingHandle.userData.waypointIndex]
      .copy(draggingHandle.position);
  selected.dirty = true;
  updateDepthGuide(draggingHandle.position);
  updatePreview();
}

canvas.addEventListener('pointermove', e => {
  if (wireMode && routing && !draggingHandle) {
    raycastAt(e);
    const targets = Object.values(view.parts)
        .filter(part => part.visible);
    const hit = raycaster.intersectObjects(targets, true)[0];
    if (hit) {
      cursorPoint = hit.point.clone();
    } else {
      const last = routing.waypoints.length
          ? routing.waypoints[routing.waypoints.length - 1]
          : new THREE.Vector3(...routing.from.position);
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(
          camera.getWorldDirection(new THREE.Vector3()), last);
      const point = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(plane, point)) {
        cursorPoint = point;
      }
    }
    updateDepthGuide(cursorPoint);
    updatePreview();
    return;
  }
  if (!draggingHandle) return;
  dragHandleTo(e);
});

canvas.addEventListener('dblclick', e => {
  if (!wireMode) return;
  if (routing) {
    raycastAt(e);
    const targets = Object.values(view.parts)
        .filter(part => part.visible);
    const hit = raycaster.intersectObjects(targets, true)[0];
    if (!hit) return;
    // the double click just pushed 1-2 waypoints at this spot
    while (routing.waypoints.length
           && routing.waypoints[routing.waypoints.length - 1]
               .distanceTo(hit.point) < 0.008) {
      routing.waypoints.pop();
    }
    const on = topPartOf(hit.object);
    finishRouting({point: [hit.point.x, hit.point.y, hit.point.z],
                   on});
    return;
  }
  if (!selected) return;
  raycastAt(e);
  const hit = raycaster.intersectObjects(handles, false)[0];
  if (hit) {
    selected.waypoints.splice(hit.object.userData.waypointIndex, 1);
    selected.dirty = true;
    rebuildHandles();
    updatePreview();
    wireHint('経由点を削除（Enterで保存）');
  }
});

function nearestSegmentIndex(point, pts) {
  let best = 0;
  let bestDist = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const seg = new THREE.Line3(pts[i], pts[i + 1]);
    const closest = new THREE.Vector3();
    seg.closestPointToPoint(point, true, closest);
    const d = closest.distanceTo(point);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}

canvas.addEventListener('pointerup', e => {
  if (draggingHandle) {
    draggingHandle = null;
    controls.enabled = true;
    if (depthGuide) { scene.remove(depthGuide); depthGuide = null; }
    wireHint('移動しました（Enterで保存・Escで取消）');
    renderCablePanel();
    return;
  }
  if (!wireMode || !downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0],
                           e.clientY - downPos[1]);
  downPos = null;
  if (moved > 8) return;   // orbit drag
  raycastAt(e);

  // 0) hole rings: thread the cable straight through the hole
  if (routing) {
    const holeHit = raycaster.intersectObjects(holeMarkers,
                                               false)[0];
    if (holeHit) {
      const hole = holeHit.object.userData.hole;
      const center = new THREE.Vector3(...hole.position);
      const axis = new THREE.Vector3(...hole.axis).normalize();
      const last = routing.waypoints.length
          ? routing.waypoints[routing.waypoints.length - 1]
          : new THREE.Vector3(...routing.from.position);
      const entrySign = last.clone().sub(center).dot(axis) >= 0
          ? 1 : -1;
      const offset = 0.006;
      routing.waypoints.push(
          center.clone().add(axis.clone()
              .multiplyScalar(entrySign * offset)),
          center.clone().add(axis.clone()
              .multiplyScalar(-entrySign * offset)));
      refreshWaypointMarkers();
      updatePreview();
      wireHint(`穴 (φ${hole.diameter}mm) を貫通する2点を追加` +
               'しました');
      return;
    }
  }

  // 1) port markers
  const portHit = raycaster.intersectObjects(portMarkers, false)[0];
  if (portHit) {
    const port = portHit.object.userData.port;
    if (routing) {
      if (port.path !== routing.from.path
          || port.port !== routing.from.port) {
        finishRouting({path: port.path, port: port.port});
      }
      return;
    }
    if (selected) {
      if (selected.reassign) {
        // commit the endpoint re-assignment
        selected.def[selected.reassign] =
            {path: port.path, port: port.port};
        selected.reassign = null;
        selected.floatPos = null;
        selected.dirty = true;
        updatePreview();
        wireHint('端点を付け替えました（Enterで保存）');
        return;
      }
      // clicking one of this cable's own endpoints detaches it
      const isFrom = port.path === selected.def.from.path
          && port.port === selected.def.from.port;
      const isTo = port.path === selected.def.to.path
          && port.port === selected.def.to.port;
      if (isFrom || isTo) {
        selected.reassign = isFrom ? 'from' : 'to';
        wireHint('付け替え先のポートをクリックしてください');
        return;
      }
    }
    routing = {from: port, waypoints: []};
    deselectCable();
    portHit.object.scale.setScalar(1.8);
    updatePreview();
    wireHint('経由点: クリックで追加 / 右クリックで取消。' +
             '終点: ポートクリック か ダブルクリック。' +
             'ドラッグで視点回転はそのまま使えます');
    return;
  }

  // 2) existing cable tubes
  if (!routing) {
    const cableGroups = Object.entries(view.cables || {});
    for (const [name, group] of cableGroups) {
      if (!group.visible) continue;
      const hit = raycaster.intersectObject(group, true)[0];
      if (!hit) continue;
      if (selected && selected.def.name === name) {
        // insert a waypoint at the clicked spot
        const pts = controlPoints();
        const index = nearestSegmentIndex(hit.point, pts);
        selected.waypoints.splice(index, 0, hit.point.clone());
        selected.dirty = true;
        rebuildHandles();
        updatePreview();
        wireHint('経由点を追加 — 青いハンドルをドラッグで調整');
      } else {
        selectCable(name);
      }
      return;
    }
  }

  // 3) part surfaces: free start point, or waypoint while routing
  const targets = Object.values(view.parts)
      .filter(part => part.visible);
  const surfaceHit = raycaster.intersectObjects(targets, true)[0];
  if (!surfaceHit) return;
  if (routing) {
    routing.waypoints.push(surfaceHit.point.clone());
    refreshWaypointMarkers();
    updatePreview();
    return;
  }
  if (!selected) {
    const on = topPartOf(surfaceHit.object);
    routing = {from: {point: [surfaceHit.point.x, surfaceHit.point.y,
                              surfaceHit.point.z],
                      on, position: [surfaceHit.point.x,
                                     surfaceHit.point.y,
                                     surfaceHit.point.z]},
               waypoints: []};
    updatePreview();
    wireHint('任意点から配線開始: 経由点をクリック → ' +
             'ポートをクリック か ダブルクリックで終点確定');
  }
});

// ---------- playback ----------
let playing = null;
function stopPlay() {
  if (playing) { clearInterval(playing); playing = null; }
  document.getElementById('playBtn').textContent = '▶ 再生';
}
document.getElementById('playBtn').onclick = () => {
  if (playing) { stopPlay(); return; }
  if (current >= view.steps.length) setStep(0, false);
  document.getElementById('playBtn').textContent = '⏸ 停止';
  playing = setInterval(() => {
    if (current >= view.steps.length) { stopPlay(); return; }
    setStep(current + 1);
  }, 1100);
};
document.getElementById('prevBtn').onclick =
    () => { stopPlay(); setStep(current - 1, false); };
document.getElementById('nextBtn').onclick =
    () => { stopPlay(); setStep(current + 1); };
document.getElementById('slider').oninput =
    e => { stopPlay(); setStep(Number(e.target.value), false); };

// ---------- sidebar ----------
const stepsDiv = document.getElementById('steps');
function buildSidebar() {
  const nIslands = (PLAN.islands || []).length || 1;
  document.getElementById('summary').textContent =
      nIslands <= 1
        ? `連結島 1 つ（分割なし）・全 ${mainView.steps.length} 手順・`
          + `ユニット ${RECIPES.length} 種`
        : `全 ${nIslands} 島・${mainView.steps.length} 手順・`
          + `ユニット ${RECIPES.length} 種`;
  stepsDiv.innerHTML = '';

  if (view !== mainView) {
    const back = document.createElement('div');
    back.className = 'backRow';
    back.textContent = '← 全体の組立に戻る';
    back.onclick = () => showView(mainView);
    stepsDiv.appendChild(back);
    const header = document.createElement('div');
    header.className = 'islandHeader';
    header.textContent = view.label + ' の内部組立';
    stepsDiv.appendChild(header);
    view.steps.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'step';
      div.draggable = false;
      div.dataset.pos = i;
      div.innerHTML = `<div class="idx">Step ${i + 1}</div>
          <div class="name">${s.component}</div>`;
      div.onclick = () => { stopPlay(); setStep(i + 1); };
      stepsDiv.appendChild(div);
    });
    updateUi();
    return;
  }

  if (RECIPES.length) {
    const header = document.createElement('div');
    header.className = 'islandHeader';
    header.textContent =
        `ユニットレシピ（種類ごとに 1 回・${RECIPES.length} 種）`;
    stepsDiv.appendChild(header);
    RECIPES.forEach(r => {
      const div = document.createElement('div');
      div.className = 'recipeRow';
      const badge = r.count > 1
          ? `<span class="badge">×${r.count}</span>` : '';
      div.innerHTML =
          `${r.id}${badge}<span class="badge blue">` +
          `${r.steps.length} 手順</span>`;
      div.onclick = () => enterRecipe(r.id);
      stepsDiv.appendChild(div);
    });
  }

  const islandSize = {};
  (PLAN.islands || []).forEach(i => islandSize[i.id] = i.members.length);
  let lastIsland = null;
  view.steps.forEach((s, i) => {
    if (s.island !== lastIsland) {
      lastIsland = s.island;
      const header = document.createElement('div');
      header.className = 'islandHeader';
      const label = ISLAND_NAME[s.island] || `モジュール${s.island}`;
      const size = islandSize[s.island];
      header.textContent = size ? `${label}（${size} 部品）` : label;
      stepsDiv.appendChild(header);
    }
    const div = document.createElement('div');
    div.className = (s.kind === 'dock' || s.kind === 'fasten'
                     || s.kind === 'wire')
        ? 'step dock' : 'step';
    div.draggable = s.kind !== 'dock' && s.kind !== 'fasten'
        && s.kind !== 'wire';
    div.dataset.pos = i;
    if (s.kind === 'wire') {
      const warn = (s.collides && s.collides.length)
          ? `<div class="floating-note">⚠️ ` +
            `${s.collides.join('、')} と干渉</div>` : '';
      div.innerHTML = `<div class="idx">Step <span class="pos">${i + 1}
          </span></div><div class="name">🔌 ${s.component} を配線
          </div>${warn}`;
    } else if (s.kind === 'fasten') {
      const warn = s.verified ? '' :
          `<div class="floating-note">⚠️ 挿入未検証あり</div>`;
      div.innerHTML = `<div class="idx">Step <span class="pos">${i + 1}
          </span></div><div class="name">🔩 ${s.component} を締める
          </div>${warn}`;
    } else if (s.kind === 'dock') {
      const warn = s.verified ? '' :
          `<div class="floating-note">⚠️ ` +
          `${s.revalidate_reason || '幾何チェック未通過'}</div>`;
      div.innerHTML = `<div class="idx">Step <span class="pos">${i + 1}
          </span></div><div class="name">${s.component} を取り付け
          <span class="badge">合体</span></div>${warn}`;
    } else {
      const n = UNIT_COUNT[s.unit] || 1;
      const badge = n > 1 ? `<span class="badge">×${n}</span>` : '';
      const recipeMark = RECIPE_BY_ID[s.unit]
          ? ' <span class="badge blue">内部</span>' : '';
      let note = s.floating
          ? '<div class="floating-note">CAD 上で遊離（要確認）</div>'
          : '';
      if (!s.verified && !s.base && !s.floating) {
        const reason = s.revalidate_reason || '幾何チェック未通過';
        note += `<div class="floating-note">⚠️ ${reason}</div>`;
      }
      if (s.screw_blocked) {
        note += `<div class="floating-note">🔩⚠️ ネジ` +
            `${s.screw_blocked}本のアクセス塞がり</div>`;
      }
      if (s.tight_fit) {
        note += `<div class="floating-note">はめ込み` +
            `（傾け・たわみで挿入）</div>`;
      }
      div.innerHTML = `<div class="idx">Step <span class="pos">${i + 1}
          </span></div><div class="name">${s.component}${badge}` +
          `${recipeMark}</div>${note}`;
      const mark = div.querySelector('.badge.blue');
      if (mark) {
        mark.style.cursor = 'pointer';
        mark.title = 'このユニットの内部組立を見る';
        mark.onclick = (e) => {
          e.stopPropagation();
          enterRecipe(s.unit);
        };
      }
    }
    div.onclick = () => { stopPlay(); setStep(i + 1); };
    stepsDiv.appendChild(div);
  });
  updateUi();
}

let dragged = null;
stepsDiv.addEventListener('dragstart', e => {
  if (view !== mainView) return;
  dragged = e.target.closest('.step');
  if (dragged) dragged.classList.add('dragging');
});
stepsDiv.addEventListener('dragover', e => {
  e.preventDefault();
  if (!dragged) return;
  const cards = [...stepsDiv.querySelectorAll('.step')];
  const after = cards.find(el =>
      el !== dragged && e.clientY < el.getBoundingClientRect().top +
                                    el.offsetHeight / 2);
  if (after) stepsDiv.insertBefore(dragged, after);
  else stepsDiv.appendChild(dragged);
});
stepsDiv.addEventListener('dragend', () => {
  if (!dragged) return;
  dragged.classList.remove('dragging');
  dragged = null;
  const posOrder = [...stepsDiv.querySelectorAll('.step')]
      .map(el => mainView.steps[Number(el.dataset.pos)]);
  if (validOrder(posOrder)) {
    const previous = mainView.steps;
    let lo = -1, hi = -1;
    posOrder.forEach((s, i) => {
      if (s !== previous[i]) {
        if (lo < 0) lo = i;
        hi = i;
      }
    });
    mainView.steps = posOrder;
    if (view === mainView) {
      stopPlay();
      setStep(Math.min(current, view.steps.length), false);
    }
    if (lo >= 0) {
      updateSaveButton();
      revalidate(lo, hi);
      return;   // buildSidebar runs after validation
    }
  }
  updateSaveButton();
  buildSidebar();
});

function validOrder(candidate) {
  const seen = new Set();
  let island = null;
  for (let i = 0; i < candidate.length; i++) {
    const s = candidate[i];
    if (s.island !== island) {
      if (seen.has(s.island)) return false;
      seen.add(s.island);
      island = s.island;
      if (s.kind !== 'dock' && !s.base &&
          candidate.some(o => o.island === island && o.base)) {
        return false;
      }
    }
    if (s.kind === 'dock') {
      const rest = candidate.slice(i + 1);
      if (rest.some(o => o.island === island)) return false;
    }
  }
  return true;
}

document.getElementById('exportBtn').onclick = () => {
  let yaml = 'steps:\n';
  mainView.steps.forEach((s, i) => {
    yaml += `- index: ${i + 1}\n`;
    if (s.kind === 'dock') {
      yaml += `  kind: dock\n  island: ${s.island}\n`;
    } else {
      yaml += `  component: ${s.component}\n  unit: ${s.unit}\n`;
    }
  });
  const blob = new Blob([yaml], {type: 'text/yaml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reordered_steps.yaml';
  a.click();
};

// Static-hosting probe: without the serve API (e.g. GitHub Pages),
// hide the buttons that need it; everything else is client-side.
fetch('/api/validate', {method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: '{"order": [], "lo": 0, "hi": -1}'})
    .then(res => {
      if (res.status === 404 || res.status === 405
          || res.status === 501) throw new Error('static');
    })
    .catch(() => {
      document.getElementById('saveBtn').style.display = 'none';
      document.getElementById('wireBtn').style.display = 'none';
      const summary = document.getElementById('summary');
      summary.title = '静的表示モード: 並べ替えの保存と配線編集は' +
          '配信サーバ (create-assembly-view-serve) が必要';
    });

(async () => {
  await loadMain();
  document.getElementById('loading').style.display = 'none';
  fitCamera(mainView);
  setStep(mainView.steps.length, false);
  buildSidebar();
})();
</script>
</body>
</html>

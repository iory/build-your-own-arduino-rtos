<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四脚ロボット 歩行シミュレーション</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f7; font-family: system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #canvas3d { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; }
  #bar {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    padding: 10px 14px; background: #fff; border-top: 1px solid #ddd;
    font-size: 14px;
  }
  #bar label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #bar input[type=range] { width: 130px; }
  button {
    padding: 6px 14px; border: 1px solid #bbb; border-radius: 6px;
    background: #fff; cursor: pointer; font-size: 14px;
  }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  #status { color: #555; margin-left: auto; font-variant-numeric: tabular-nums; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #f4f5f7; z-index: 10; color: #333;
  }
  #overlay progress { width: 260px; }
  #overlay .small { font-size: 12px; color: #888; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas3d"></canvas>
  <div id="bar">
    <button id="walkBtn" class="primary">歩く</button>
    <button id="resetBtn">リセット</button>
    <label>制御
      <select id="mode">
        <option value="rl">RL 方策</option>
        <option value="imu">RL 方策（IMU あり）</option>
        <option value="naive">sin/cos 歩行（本文 13.5）</option>
      </select>
    </label>
    <span id="robotName"></span>
    <button id="pushBtn">押す</button>
    <label>強さ <input type="range" id="push" min="0.5" max="3.0" step="0.1" value="2.0">
      <span id="pushVal">2.0</span> m/s</label>
    <label>前進 <input type="range" id="vx" min="-0.05" max="0.15" step="0.01" value="0.12">
      <span id="vxVal">0.12</span> m/s</label>
    <label>旋回 <input type="range" id="wz" min="-0.35" max="0.35" step="0.05" value="0">
      <span id="wzVal">0.00</span> rad/s</label>
    <label><input type="checkbox" id="follow" checked> カメラ追従</label>
    <span id="status"></span>
  </div>
</div>
<div id="overlay">
  <div id="loadMsg">物理エンジン (MuJoCo WASM) を読み込み中…</div>
  <progress id="loadBar" max="100" value="0"></progress>
  <div class="small">初回は約 16 MB ダウンロードします</div>
</div>

<script type="importmap">
{ "imports": { "three": "../vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from '../vendor/OrbitControls.js';
import loadMujoco from './vendor/mujoco.js';
import {QuadPolicy, makeController, NaiveGait, DELAY_MIN, DELAY_MAX} from './walk_core.js';

// 機体ごとの設定。?robot=krs で KRS 版 (KRS-3302 ICS) の機体と方策になる。
// 既定は Feetech 版 (STS3215) で、こちらは今までと同じ。
const ROBOTS = {
  feetech: {
    label: '',
    xml: 'model/arduino_os_quad_robot.xml',
    policies: {rl: 'policy.json', imu: 'policy_imu.json'},
    delay: {min: DELAY_MIN, max: DELAY_MAX},
    naive: true,
    vx: {min: -0.05, max: 0.15, value: 0.12},
  },
  krs: {
    label: 'KRS 版',
    xml: 'model/krs_quad_robot.xml',
    // KRS 版は IMU ありの方策だけ (rl/krs_env_cfgs.py)
    policies: {imu: 'policy_krs_imu.json'},
    delay: {min: 4, max: 8},     // rl/krs_robot_cfg.py の KRS_DELAY_MIN/MAX_LAG
    naive: false,                // 本文 13.5 の歩行は Feetech 版の脚の寸法
    vx: {min: -0.06, max: 0.12, value: 0.08},
  },
};
const robotKey = new URLSearchParams(location.search).get('robot') === 'krs'
    ? 'krs' : 'feetech';
const ROBOT = ROBOTS[robotKey];

const $ = id => document.getElementById(id);
const setProgress = (v, msg) => {
  $('loadBar').value = v;
  if (msg) $('loadMsg').textContent = msg;
};

async function fetchBinary(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ': ' + res.status);
  return new Uint8Array(await res.arrayBuffer());
}

async function main() {
  const mujoco = await loadMujoco();
  setProgress(30, 'ロボットモデルを読み込み中…');

  const xml = await (await fetch(ROBOT.xml)).text();
  // 同じ STL を複数の <mesh> が参照する (KRS 版はネジなどを 1 ファイルにまとめてある)
  // ので、ファイル名ごとに 1 回だけ読む。VFS は同じ名前を 2 度足すと失敗する。
  const meshFiles = [...new Set(
      [...xml.matchAll(/file="([^"]+\.stl)"/g)].map(m => m[1]))];
  const vfs = new mujoco.MjVFS();
  let done = 0;
  await Promise.all(meshFiles.map(async f => {
    vfs.addBuffer('assets/' + f, await fetchBinary('model/assets/' + f));
    done += 1;
    setProgress(30 + 50 * done / meshFiles.length);
  }));

  setProgress(85, '学習済み方策を読み込み中…');
  const policies = {};
  await Promise.all(Object.entries(ROBOT.policies).map(async ([mode, f]) => {
    const res = await fetch(f);
    if (!res.ok) throw new Error(f + ': ' + res.status);
    policies[mode] = new QuadPolicy(await res.json());
  }));

  const model = mujoco.MjModel.from_xml_string(xml, vfs);
  const data = new mujoco.MjData(model);
  // この機体に無い制御 (KRS 版の IMU なし・sin/cos 歩行) は選択肢から外す
  for (const o of [...$('mode').options]) {
    const ok = o.value === 'naive' ? ROBOT.naive : o.value in policies;
    if (!ok) o.remove();
  }
  $('robotName').textContent = ROBOT.label;
  $('vx').min = ROBOT.vx.min;
  $('vx').max = ROBOT.vx.max;
  $('vx').value = ROBOT.vx.value;
  $('vxVal').textContent = ROBOT.vx.value.toFixed(2);
  let policy = policies[$('mode').value];
  const ctl = makeController(mujoco, model, data, policy, ROBOT.delay);
  const gait = new NaiveGait();   // 本文 13.5 の trot (sin/cos + 2リンク IK)

  // ---------- three.js ----------
  const canvas = $('canvas3d');
  const renderer = new THREE.WebGLRenderer({canvas, antialias: true});
  renderer.setPixelRatio(window.devicePixelRatio);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf4f5f7);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
  camera.up.set(0, 0, 1);   // MuJoCo は Z-up
  camera.position.set(0.55, -0.55, 0.35);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.target.set(0, 0, 0.1);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x99a, 1.5));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4);
  sun.position.set(1, -2, 3);
  scene.add(sun);

  // 床: グリッド (MuJoCo 側の plane と同じ z=0)
  const grid = new THREE.GridHelper(10, 100, 0xbbbbbb, 0xdddddd);
  grid.rotation.x = Math.PI / 2;
  scene.add(grid);
  const floor = new THREE.Mesh(
      new THREE.CircleGeometry(5, 48),
      new THREE.MeshLambertMaterial({color: 0xe8eaee}));
  floor.position.z = -0.001;
  scene.add(floor);

  // MuJoCo の mesh geom を three.js メッシュにする
  const mjGEOM_MESH = mujoco.mjtGeom.mjGEOM_MESH.value;
  const meshVert = model.mesh_vert, meshFace = model.mesh_face;
  const meshVertadr = model.mesh_vertadr, meshVertnum = model.mesh_vertnum;
  const meshFaceadr = model.mesh_faceadr, meshFacenum = model.mesh_facenum;
  const geomObjs = [];   // {idx, obj}
  for (let g = 0; g < model.ngeom; g++) {
    if (model.geom_type[g] !== mjGEOM_MESH) continue;
    const mid = model.geom_dataid[g];
    const va = meshVertadr[mid], vn = meshVertnum[mid];
    const fa = meshFaceadr[mid], fn = meshFacenum[mid];
    const pos = new Float32Array(vn * 3);
    for (let i = 0; i < vn * 3; i++) pos[i] = meshVert[va * 3 + i];
    const idx = new Uint32Array(fn * 3);
    for (let i = 0; i < fn * 3; i++) idx[i] = meshFace[fa * 3 + i] ;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeVertexNormals();
    const r = model.geom_rgba[g * 4], gg = model.geom_rgba[g * 4 + 1],
          b = model.geom_rgba[g * 4 + 2];
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(r, gg, b), metalness: 0.1, roughness: 0.7});
    const obj = new THREE.Mesh(geo, mat);
    obj.matrixAutoUpdate = false;
    scene.add(obj);
    geomObjs.push({idx: g, obj});
  }

  const m4 = new THREE.Matrix4();
  function syncPose() {
    const xpos = data.geom_xpos, xmat = data.geom_xmat;
    for (const {idx, obj} of geomObjs) {
      const p = idx * 3, r = idx * 9;
      m4.set(xmat[r], xmat[r + 1], xmat[r + 2], xpos[p],
             xmat[r + 3], xmat[r + 4], xmat[r + 5], xpos[p + 1],
             xmat[r + 6], xmat[r + 7], xmat[r + 8], xpos[p + 2],
             0, 0, 0, 1);
      obj.matrix.copy(m4);
    }
  }

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w || canvas.height !== h) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
  }

  // 押した向きを示す矢印 (押した瞬間から 0.6 s 表示)
  const arrow = new THREE.ArrowHelper(
      new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 0.15, 0xdc2626, 0.05, 0.035);
  arrow.visible = false;
  scene.add(arrow);
  let arrowUntil = 0;

  // ---------- simulation ----------
  let walking = false;
  // 倒れたら止める。Feetech 版は学習と同じく足先の球しか床と当たらないので、
  // そのまま進めると胴体が床を突き抜ける (KRS 版は胴体の箱と膝も当たる)。
  let fallen = false;
  const FALL_TILT_DEG = 60;
  // 制御ごとの「押した回数 / 倒れた回数」(IMU なし・あり の比較用)
  const tally = {};
  const tallyOf = m => (tally[m] ??= {push: 0, fall: 0});
  function tiltDeg() {
    const g = ctl.imu().gravity;
    return Math.acos(Math.max(-1, Math.min(1, -g[2]))) * 180 / Math.PI;
  }
  function reset() {
    mujoco.mj_resetDataKeyframe(model, data, 0);
    mujoco.mj_forward(model, data);
    policy.reset();
    gait.reset();
    ctl.reset();
    for (let i = 0; i < policy.nj; i++) data.ctrl[i] = policy.defaultQ[i];
    walking = false;
    fallen = false;
    $('walkBtn').textContent = '歩く';
  }
  reset();

  // 1 制御周期 (0.02 s) ぶん進める。RL は速度指令、naive はストライド長で
  // 前進量を変える (vx 0.15 -> ストライド 0.06 m)。naive に旋回は無い。
  function stepOnce() {
    const vx = +$('vx').value;
    if ($('mode').value !== 'naive') {
      ctl.controlStep([vx, 0, +$('wz').value]);
    } else {
      gait.stepX = vx * 0.4;
      ctl.stepTargets(gait.step(policy.dt));
    }
  }

  $('walkBtn').onclick = () => {
    if (fallen) reset();
    walking = !walking;
    $('walkBtn').textContent = walking ? '一時停止' : '歩く';
  };
  $('resetBtn').onclick = reset;
  // 押す: 学習中の push と同じく、胴体の速度に水平方向の速度を一瞬で足す。
  // 向きはランダム。学習時は最大 0.25 m/s (IMU 版の仕上げは 0.75 m/s) だが、
  // 足先が滑るので 1 m/s 程度ではどちらの方策も倒れない。差が出るのは
  // 前進 0 で立っているときの 2 m/s 前後から。
  $('pushBtn').onclick = () => {
    if (fallen) return;
    tallyOf($('mode').value).push += 1;
    const v = +$('push').value, th = Math.random() * 2 * Math.PI;
    data.qvel[0] += v * Math.cos(th);
    data.qvel[1] += v * Math.sin(th);
    const dir = new THREE.Vector3(Math.cos(th), Math.sin(th), 0);
    arrow.setDirection(dir);
    arrow.position.set(data.qpos[0], data.qpos[1], data.qpos[2])
        .addScaledVector(dir, -0.2);
    arrow.visible = true;
    arrowUntil = performance.now() + 600;
    if (!walking) $('walkBtn').click();
  };
  $('push').oninput = () => $('pushVal').textContent = (+$('push').value).toFixed(1);
  function selectMode() {
    const m = $('mode').value;
    if (m !== 'naive') {
      policy = policies[m];
      ctl.setPolicy(policy);
    }
  }
  $('mode').onchange = () => {
    selectMode();
    policy.reset();
    gait.reset();
    $('wz').disabled = $('mode').value === 'naive';
    if ($('wz').disabled) { $('wz').value = 0; $('wzVal').textContent = '0.00'; }
  };
  $('vx').oninput = () => $('vxVal').textContent = (+$('vx').value).toFixed(2);
  $('wz').oninput = () => $('wzVal').textContent = (+$('wz').value).toFixed(2);
  // ?mode=imu&vx=0 などで最初の制御と前進速度を選べる (IMU のページから開くとき)
  const params = new URLSearchParams(location.search);
  const initialMode = params.get('mode');
  if ([...$('mode').options].some(o => o.value === initialMode)) {
    $('mode').value = initialMode;
    $('mode').onchange();
  }
  if (params.has('vx') && Number.isFinite(+params.get('vx'))) {
    $('vx').value = params.get('vx');
    $('vx').oninput();
  }

  let acc = 0, lastT = performance.now();
  const followTarget = new THREE.Vector3();
  function frame(now) {
    requestAnimationFrame(frame);
    resize();
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    if (walking) {
      acc += dt;
      let n = 0;
      while (acc >= policy.dt && n < 4) {   // 実時間に追従 (最大 4 制御周期/フレーム)
        stepOnce();
        acc -= policy.dt;
        n += 1;
        if (tiltDeg() > FALL_TILT_DEG) {
          fallen = true;
          walking = false;
          tallyOf($('mode').value).fall += 1;
          $('walkBtn').textContent = '歩く';
          break;
        }
      }
      if (n === 4) acc = 0;
    }
    syncPose();
    if (arrow.visible && now > arrowUntil) arrow.visible = false;
    if ($('follow').checked) {
      followTarget.set(data.qpos[0], data.qpos[1], 0.1);
      const delta = followTarget.clone().sub(controls.target);
      controls.target.add(delta);
      camera.position.add(delta);
    }
    // 傾き = 重力の向きと胴体の -z 軸のなす角
    const t = tallyOf($('mode').value);
    $('status').textContent =
        `x ${data.qpos[0].toFixed(2)} m / 傾き ${tiltDeg().toFixed(0)}° / 押した ${t.push} 回・倒れた ${t.fall} 回`
        + (fallen ? ' / 転倒（「歩く」でやり直し）' : '');
    controls.update();
    renderer.render(scene, camera);
  }

  $('overlay').remove();
  requestAnimationFrame(frame);
}

main().catch(err => {
  $('loadMsg').textContent = '読み込みに失敗しました: ' + err;
  console.error(err);
});
</script>
</body>
</html>

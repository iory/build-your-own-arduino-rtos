{% extends "!layout.html" %}
{%- block extrahead %}
  {{ super() }}
  <link rel="icon" type="image/png" sizes="32x32" href="{{ pathto('_static/favicon-32.png', 1) }}">
  <link rel="apple-touch-icon" href="{{ pathto('_static/apple-touch-icon.png', 1) }}">
  {%- if google_site_verification %}
  <meta name="google-site-verification" content="{{ google_site_verification }}">
  {%- endif %}
{%- endblock extrahead %}

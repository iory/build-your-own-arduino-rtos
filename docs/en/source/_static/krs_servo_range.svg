<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600" font-family="Helvetica, Arial, sans-serif">
<rect width="820" height="600" rx="8" fill="#fcfcfb"/>
<text x="24" y="38" font-size="19" font-weight="bold" fill="#22211f">Range the KRS-3302 output shaft can measure and reach</text>
<text x="24" y="62" font-size="14" fill="#52514e">The output shaft seen from above</text>
<circle cx="240" cy="270" r="122" fill="#eceae5" stroke="#d3d1cb"/>
<path d="M 346.1 376.1 A 150 150 0 0 1 133.9 376.1" fill="none" stroke="#a8a6a0" stroke-width="16" stroke-dasharray="6 6"/>
<path d="M 133.9 376.1 A 150 150 0 1 1 346.1 376.1" fill="none" stroke="#2563c9" stroke-width="16"/>
<line x1="126.9" y1="383.1" x2="119.8" y2="390.2" stroke="#22211f" stroke-width="2"/>
<text x="104.2" y="410.8" font-size="15" fill="#22211f" text-anchor="middle">−135°</text>
<line x1="80.0" y1="270.0" x2="70.0" y2="270.0" stroke="#22211f" stroke-width="2"/>
<text x="48.0" y="275.0" font-size="15" fill="#22211f" text-anchor="middle">−90°</text>
<line x1="126.9" y1="156.9" x2="119.8" y2="149.8" stroke="#22211f" stroke-width="2"/>
<text x="104.2" y="139.2" font-size="15" fill="#22211f" text-anchor="middle">−45°</text>
<line x1="240.0" y1="110.0" x2="240.0" y2="100.0" stroke="#22211f" stroke-width="2"/>
<text x="240.0" y="83.0" font-size="15" fill="#22211f" text-anchor="middle">0°</text>
<line x1="353.1" y1="156.9" x2="360.2" y2="149.8" stroke="#22211f" stroke-width="2"/>
<text x="375.8" y="139.2" font-size="15" fill="#22211f" text-anchor="middle">+45°</text>
<line x1="400.0" y1="270.0" x2="410.0" y2="270.0" stroke="#22211f" stroke-width="2"/>
<text x="432.0" y="275.0" font-size="15" fill="#22211f" text-anchor="middle">+90°</text>
<line x1="353.1" y1="383.1" x2="360.2" y2="390.2" stroke="#22211f" stroke-width="2"/>
<text x="375.8" y="410.8" font-size="15" fill="#22211f" text-anchor="middle">+135°</text>
<line x1="240" y1="270" x2="240.0" y2="156.0" stroke="#d97706" stroke-width="12" stroke-linecap="round"/>
<circle cx="240" cy="270" r="14" fill="#d97706"/>
<text x="240.0" y="456.0" font-size="14" fill="#52514e" text-anchor="middle">90° not measurable</text>
<rect x="470" y="118" width="26" height="14" fill="#2563c9"/>
<text x="506" y="130" font-size="15" fill="#22211f">Measurable, reachable: 270° (±135°)</text>
<line x1="470" y1="161" x2="496" y2="161" stroke="#a8a6a0" stroke-width="12" stroke-dasharray="6 6"/>
<text x="506" y="166" font-size="15" fill="#22211f">Not measurable: 90°</text>
<line x1="474" y1="197" x2="492" y2="197" stroke="#d97706" stroke-width="10" stroke-linecap="round"/>
<text x="506" y="202" font-size="15" fill="#22211f">Centre (7500)</text>
<text x="506" y="224" font-size="14" fill="#52514e">Pressing z in ics-manager moves</text>
<text x="506" y="246" font-size="14" fill="#52514e">the shaft here. Mount the leg so</text>
<text x="506" y="268" font-size="14" fill="#52514e">that in this position it points</text>
<text x="506" y="290" font-size="14" fill="#52514e">straight down</text>
<text x="470" y="330" font-size="14" fill="#52514e">If the horn is mounted far off, the angles</text>
<text x="470" y="352" font-size="14" fill="#52514e">the joint needs fall outside this range,</text>
<text x="470" y="374" font-size="14" fill="#52514e">and the servo cannot move there</text>
<text x="24" y="490" font-size="15" fill="#22211f">Position values (pulse) sent to the servo, and angles. 4000 / 135 ≈ 29.6 per degree</text>
<rect x="110" y="522" width="600" height="16" rx="3" fill="#2563c9"/>
<line x1="110.0" y1="516" x2="110.0" y2="544" stroke="#22211f" stroke-width="2"/>
<text x="110.0" y="566" font-size="15" fill="#22211f" text-anchor="middle">3500 (−135°)</text>
<line x1="410.0" y1="516" x2="410.0" y2="544" stroke="#22211f" stroke-width="2"/>
<text x="410.0" y="566" font-size="15" fill="#22211f" text-anchor="middle">7500 (0°)</text>
<line x1="710.0" y1="516" x2="710.0" y2="544" stroke="#22211f" stroke-width="2"/>
<text x="710.0" y="566" font-size="15" fill="#22211f" text-anchor="middle">11500 (+135°)</text>
</svg>
